<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeDex Basic Structur</title>

    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./colors.css">
    <link rel="stylesheet" href="./styles/assets.css">
    <script src="./script.js" defer></script>
    <script src="./scripts/templates.js" defer></script>
</head>

<body class="darkMode">

<header>
    <div class="headerContainer">

        <img src="/icons/misc/pokeball.png" alt="Pokéball" class="logo_icon">    
        <div class="search_container">
            <input type="text" id="pokemonSearch" placeholder="Pokémon suchen...">

            <button type="button" class="search_button" onclick="searchPokemon()">Suchen</button>
        </div>

    </div>
</header>

<main>

    <section class="hero_section">


          <img src="./icons/misc/pokemon.png" class="pokemonBanner" alt="pokemon">
 


    </section>

    <section id="cardContainer" class="card_container">

        <p class="loading_text">
            Karten werden geladen...
        </p>

    </section>
        <div id="loadingSpinner" class="loadingSpinner hidden">
            <img src="./icons/misc/pokeball.png" alt="Loading">
        </div>
</main>

<div id="pokemonDialog" class="pokemonDialog">
    <div class="dialogContent" id="dialogContent"></div>
</div>

<footer>

    <div class="footer_container">

        <p>
            © 2026 PokeCards
        </p>
        <p>
        <button id="loadMoreBtn">Load More</button>  
        <button id="darkModeButton">Dark Mode</button>       

        </p>

    </div>

</footer>

</body>

</html>
