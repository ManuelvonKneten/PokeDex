<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeDex</title>

    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./styles/colors.css">
    <link rel="stylesheet" href="./styles/assets.css">
    <link rel="stylesheet" href="./styles/responsiv.css">

    <link rel="icon" type="image/png" sizes="32x32" href="./icons/misc/pokeball.png">
    <script src="./script.js" defer></script>
    <script src="./scripts/templates.js" defer></script>
</head>

<body>

<header>
<div class="headerContainer">
              <img src="./icons/misc/pokemon.png" class="pokemonBanner" alt="pokemon">

            <div class="search_container">
                <input type="text" id="pokemonSearch" placeholder="Search Pokémon...">
                 <button type="button" class="searchBtn" onclick="searchPokemon()"></button>
            </div>

</header>

<main>

    <section class="hero_section">
     </section>
    <section id="cardContainer" class="card_container">

        <p class="loading_text">
            Loading Cards...
        </p>

    </section>
        <div id="loadingSpinner" class="loadingSpinner hidden">
            <img src="./icons/misc/loading_spinner.png" alt="Loading">
        </div>
</main>

<div id="pokemonDialog" class="pokemonDialog">
    <div class="dialogContent" id="dialogContent"></div>
</div>

<footer>

    <div class="footer_container">
  
        <p>
        <button class="loadMoreBtn">More</button>  
        <button class="loadMoreBtn" onclick="toggleDarkMode()">Color</button>       
        </p>


    </div>

</footer>

</body>

</html>
