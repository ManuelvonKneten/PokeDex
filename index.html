<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeDex Basic Structur</title>

    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./colors.css">

    <script src="./script.js" defer></script>
    <script src="./scripts/templates.js" defer></script>
</head>

<body>

<header>
    <div class="headerContainer">

        <div class="logo">
            PokeCards
        </div>

        <nav class="navLinks">
            <a href="#">Startseite</a>
            <a href="#">Karten</a>
            <a href="#">Kontakt</a>
        </nav>

        <div class="search_container">
        <input type="text" id="pokemonSearch" placeholder="Pokémon suchen..." />
        </div>

    </div>
</header>

<main>

    <section class="hero_section">

        <h1>
            PokeDex
        </h1>

        <p>
                Dynamisches Laden von Pokemon Karten
        </p>

    </section>

    <section id="cardContainer" class="card_container">

        <p class="loading_text">
            Karten werden geladen...
        </p>

    </section>

</main>

<div id="pokemonDialog" class="pokemonDialog">
    <div class="dialogContent" id="dialogContent"></div>
</div>

<footer>

    <div class="footer_container">

        <p>
            © 2026 PokeCards
        </p>

        <p>
            Pokemon API Projekt
        </p>

    </div>

</footer>

</body>

</html>
